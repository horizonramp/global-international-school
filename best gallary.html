<style>
  body {
  margin: 0;
  background:white;
  
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.ht {
    text-align: center;
    justify-content: center;
    align-items: center;
    justify-items: center;
}
.school-header {
  background: linear-gradient(135deg, #004aad, #0077ff);
  color: white;
  text-align: center;
  padding: 25px 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  border: 3px solid blue;

 
}

.school-header h1 {
  font-size: 3rem;
  margin: 0;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.school-header .tagline {
  font-size: 1.2rem;
  margin-top: 10px;
  font-style: italic;
  opacity: 0.9;
}
.slider {
  position: relative;
  margin-top: 20px;
  width:100%;
  height: 450px;
  overflow: hidden;
  border:2px solid #111;
  border-radius: 10px;
  box-shadow:2px #111;
}

.slides {
  display: flex;
  width: 100%;
  transition: transform 0.5s ease;
}

.slide {
  width: 100%;
  height: 450px;
  flex-shrink: 0;
}

.slide img {
  width: 100%;
  height: 450px;
  object-fit: cover;
}

input[type="radio"] {
  display: none;
}

#s1:checked ~ .slides { transform: translateX(0); }
#s2:checked ~ .slides { transform: translateX(-100%); }
#s3:checked ~ .slides { transform: translateX(-200%); }
#s4:checked ~ .slides { transform: translateX(-300%); }

.controls label {
  position: absolute;
  top: 50%;
  width: 30px;
  height: 30px;
  background:black;
  transform: translateY(-50%);
  cursor: pointer;
  z-index: 2;
}

.prev {
  left: 10px;
  clip-path: polygon(100% 0, 0 50%, 100% 100%);
}

.next {
  right: 10px;
  clip-path: polygon(0 0, 100% 50%, 0 100%);
}

#s1:checked ~ .controls label:nth-child(1),
#s1:checked ~ .controls label:nth-child(2) { display: block; }

#s2:checked ~ .controls label:nth-child(3),
#s2:checked ~ .controls label:nth-child(4) { display: block; }

#s3:checked ~ .controls label:nth-child(5),
#s3:checked ~ .controls label:nth-child(6) { display: block; }

#s4:checked ~ .controls label:nth-child(7),
#s4:checked ~ .controls label:nth-child(8) { display: block; }

.controls label { display: none; }

.dots {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
}

.dots label {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #666;
  cursor: pointer;
}

#s1:checked ~ .dots label:nth-child(1),
#s2:checked ~ .dots label:nth-child(2),
#s3:checked ~ .dots label:nth-child(3),
#s4:checked ~ .dots label:nth-child(4) {
  background: blue;
}
</style>
